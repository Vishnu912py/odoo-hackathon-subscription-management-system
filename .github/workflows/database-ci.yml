name: Database Integrity & PostgreSQL CI

on:
  push:
    branches:
      - main
      - feat/db-schema
  pull_request:
    branches:
      - main

jobs:
  database-test:
    name: PostgreSQL 16 Migrations & Constraint Integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brightloop
          POSTGRES_PASSWORD: brightloop_test_password
          POSTGRES_DB: subscription_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brightloop -d subscription_management_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://brightloop:brightloop_test_password@localhost:5432/subscription_management_test?schema=public"
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate --schema=database/prisma/schema.prisma

      - name: Generate Prisma Client
        run: npx prisma generate --schema=database/prisma/schema.prisma

      - name: Run Static Schema & DDL Integrity Verifier
        run: python database/scripts/verify_schema_integrity.py

      - name: Apply Migrations (Deploy to Clean PostgreSQL)
        run: npx prisma migrate deploy --schema=database/prisma/schema.prisma

      - name: Seed Database (Run 1)
        run: npm run prisma:seed

      - name: Seed Database (Run 2 - Idempotency Check)
        run: npm run prisma:seed

      - name: Run Live PostgreSQL Constraint Integration Tests
        run: npm run test:db
