name: PostgreSQL Performance Benchmark (10k Subs, 100k Invoices)

on:
  workflow_dispatch:
  push:
    branches:
      - feat/db-benchmark

jobs:
  benchmark:
    name: Large-Scale Database Performance Benchmark (PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brightloop
          POSTGRES_PASSWORD: brightloop_test_password
          POSTGRES_DB: subscription_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brightloop -d subscription_management_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://brightloop:brightloop_test_password@localhost:5432/subscription_management_test?schema=benchmark"
      DIRECT_URL: "postgresql://brightloop:brightloop_test_password@localhost:5432/subscription_management_test?schema=benchmark"
      BENCHMARK_SCHEMA: "benchmark"
      NODE_ENV: test

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Generate Large-Scale Benchmark Dataset (10,000 Subs, 100,000 Invoices)
        run: npm run benchmark:generate

      - name: Execute Reporting Persistence Benchmark Suite
        run: |
          set -o pipefail
          npm run benchmark:run 2>&1 | tee benchmark.log

      - name: Publish Benchmark Summary
        if: always()
        run: |
          if [ -f benchmark.log ]; then
            echo "### PostgreSQL 16 Benchmark Results (10,000 Subs, 100,000 Invoices)" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat benchmark.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
